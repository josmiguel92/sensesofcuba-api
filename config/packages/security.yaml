# see https://github.com/symfony/recipes/blob/master/symfony/security-bundle/3.3/config/packages/security.yaml
security:
    encoders:
        App\Entity\User: 'auto'

    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        database_users:
            entity: { class: App\Entity\User, property: email }

    role_hierarchy:
        ROLE_USER:      ROLE_CLIENT
        ROLE_EDITOR:    ROLE_USER
        ROLE_ADMIN:     [ROLE_EDITOR, ROLE_USER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_platform:
            pattern: ^/api/v2/
            anonymous: true

        api_anonymous:
            pattern: ^/api/(register|reset-password)
            anonymous: true
            stateless: true
#            provider: database_users

        api_login:
            pattern: ^/api/login
            anonymous: true
            stateless: true
            provider: database_users
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            anonymous: true
            stateless: true
            provider: database_users
            guard:
                authenticators:
                    - lexik_jwt_authentication.jwt_token_authenticator


        main_admin:
            pattern: ^/(admin|dash)
            anonymous: true
            provider: database_users
            form_login:
                login_path: /
                check_path: login
                default_target_path: home
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
            guard:
                authenticators:
                    - lexik_jwt_authentication.jwt_token_authenticator
        html_proxy:
            pattern: ^/
            security: false

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
#        - { path: ^/api/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api/v2/, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api/(login|register|reset-password), roles: IS_AUTHENTICATED_ANONYMOUSLY }
#        - { path: ^/api/reset-password, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_EDITOR }
        - { path: ^/dash, roles: ROLE_EDITOR }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        #- { path: ^/, roles: IS_AUTHENTICATED_ANONYMOUSLY, requires_channel: https }
